[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdetr-reproduction"
version = "0.1.0"
description = "Structured Python reproduction of RF-DETR Weight-Sharing NAS, Post-Training Grid Search, Diagnostics, Deployment, and Baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "pycocotools>=2.0.7",
]
deploy = [
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0",
]
baselines = [
    "ultralytics>=8.3.0",
]
backup = [
    "huggingface_hub>=0.24.0",
    "wandb>=0.17.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src", "configs" = "configs"}
packages = [
    "configs",
    "rfdetr_reproduction",
    "rfdetr_reproduction.environment",
    "rfdetr_reproduction.data",
    "rfdetr_reproduction.nas",
    "rfdetr_reproduction.training",
    "rfdetr_reproduction.diagnostics",
    "rfdetr_reproduction.search",
    "rfdetr_reproduction.deployment",
    "rfdetr_reproduction.baselines",
    "rfdetr_reproduction.segmentation",
    "rfdetr_reproduction.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
